name: Build Android TV debug candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/debug-candidate.yml"
      - "kotlin-tv/**"
      - "scripts/package_debug_candidate.py"

permissions:
  contents: read

concurrency:
  group: debug-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'kanonso/hongguoTV'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Run offline release-contract tests
        run: python3 -m unittest discover -s kotlin-tv/tools -p 'test_*.py'
      - name: Test and build both Android TV debug variants
        run: |
          set -euo pipefail
          for legacy in true false; do
            ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PlegacyAudio="$legacy" --console=plain
          done
          python3 kotlin-tv/tools/verify_audio_packages.py debug
      - name: Package and verify independently installable APKs
        run: python3 scripts/package_debug_candidate.py
      - name: Add test report to the workflow summary
        run: cat outputs/debug-candidate/TEST-REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hongguotv-debug-candidate-${{ github.run_number }}-${{ github.sha }}
          path: outputs/debug-candidate/
          if-no-files-found: error
          retention-days: 30
