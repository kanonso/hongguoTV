name: Build and publish signed Android TV pre-release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'kanonso/hongguoTV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require and decode the original production signing key
        env:
          HONGGUOTV_KEYSTORE_B64: \${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          HONGGUOTV_STORE_PASSWORD: \${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: \${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: \${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HONGGUOTV_KEYSTORE_B64 HONGGUOTV_STORE_PASSWORD HONGGUOTV_KEY_ALIAS HONGGUOTV_KEY_PASSWORD; do
            if [[ -z "\${!name}" ]]; then
              echo "::error::Missing original signing secret: $name. No replacement key or debug-signing fallback is allowed."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$HONGGUOTV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Run release-contract tests
        run: python3 -m unittest discover -s kotlin-tv/tools -p 'test_*.py'
      - name: Build all original-signed APK variants
        env:
          GH_TOKEN: \${{ github.token }}
          HONGGUOTV_STORE_PASSWORD: \${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: \${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: \${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: bash scripts/build-kotlin.sh
      - name: Create a local release tag for this exact main commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = .*?: "\\([^"]*\\)".*/\\1/p' kotlin-tv/app/build.gradle.kts)"
          TAG="kotlin-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA" || {
              echo "::error::The tag exists but points to a different commit."
              exit 1
            }
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish verified GitHub Pre-release for device testing
        env:
          GH_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_REF: \${{ github.ref }}
        run: python3 scripts/release_tv.py candidate "\${{ steps.version.outputs.tag }}"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
