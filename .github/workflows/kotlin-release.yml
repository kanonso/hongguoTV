name: Approve and promote tested Android TV candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tested Pre-release tag, for example kotlin-v0.16.21"
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    if: github.repository == 'kanonso/hongguoTV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Verify tested candidate assets and promote the exact same APKs
        env:
          GH_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_REF: \${{ github.ref }}
          RELEASE_TAG: \${{ inputs.tag }}
        run: python3 scripts/release_tv.py promote "$RELEASE_TAG"
